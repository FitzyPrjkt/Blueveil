// Identity contract — blueveil.contracts.v1.
syntax = "proto3";

package blueveil.contracts.v1;

enum IdentityType {
  IDENTITY_TYPE_UNSPECIFIED = 0;
  IDENTITY_TYPE_USER = 1;
  IDENTITY_TYPE_SERVICE_ACCOUNT = 2;
  IDENTITY_TYPE_WORKLOAD = 3;
  IDENTITY_TYPE_ANONYMOUS = 4;
}

message Identity {
  string id = 1;
  IdentityType type = 2;
  string name = 3;
}
